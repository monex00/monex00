name: nagare
on:
  schedule:
    - cron: "17 0 * * *"
  push:
    paths:
      - .github/workflows/nagare.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: monex00/nagare@main
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nagare/nagare.svg
          git diff --cached --quiet || git commit -m "Redraw nagare"
          git push
